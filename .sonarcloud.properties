sonar.projectKey=victron-venus_dbus-esphome-grid-sensor
sonar.organization=victron-venus

# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=.github/workflows/release.yml,scripts/prepare_version.py,scripts/release_versioned.py

sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,**/conftest.py
sonar.cpd.exclusions=tests/**

sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6444
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/release.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/release.yml
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/release.yml
