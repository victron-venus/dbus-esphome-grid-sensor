[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbus-esphome-grid-sensor"
version = "1.0.1"
description = "ESP32 CT Grid Sensor with D-Bus service for Victron Venus OS"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "victron-venus contributors", email = "alvit.work+4alvit@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.11"
# vedbus (Victron's D-Bus framework) is only installable on Venus OS devices
# from the Victron package feed - it is not on PyPI, so it must not sit in
# base dependencies or CI's 'pip install -e .[dev,test]' can never resolve.
dependencies = [
    "paho-mqtt>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "setuptools>=68",
    "wheel",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/victron-venus/dbus-esphome-grid-sensor"
Repository = "https://github.com/victron-venus/dbus-esphome-grid-sensor"
Issues = "https://github.com/victron-venus/dbus-esphome-grid-sensor/issues"

[tool.setuptools]
py-modules = ["dbus_grid_service", "service_launcher"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = ["E501", "B008"]
[tool.ruff.lint.per-file-ignores]
# Allow assert and print in tests
"tests/*" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# Venus OS / system D-Bus libraries ship no type stubs anywhere
[[tool.mypy.overrides]]
module = ["dbus.*", "gi.*", "vedbus"]
ignore_missing_imports = true

# Tests use untyped stubs for vedbus/paho-mqtt; mypy need not validate them.
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
