name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@b8154dfcf2d4cf829cb41514ef3cbf82c68a418f
    with:
      python-version: '3.12.13'
      use-uv-lock: true
      build-dependency-group: build
      # Hardware-free tests now exist; enable pytest execution
      run-tests: true
      # Enforce minimum coverage to prevent regressions
      coverage-threshold: 50
