name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@ba44ba6d9b63e884a5bde2dd30a990bb434cfe74
    with:
      python-version: '3.12.13'
      # Hardware-free tests now exist; enable pytest execution
      run-tests: true
      # Enforce minimum coverage to prevent regressions
      coverage-threshold: 50
