name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@e9d505643bc562d6f725a4d3183d9c67ac7e536b # main
    with:
      python-version: '3.12.13'
      use-uv-lock: true
      build-dependency-group: build
      # Hardware-free tests now exist; enable pytest execution
      run-tests: true
      # Enforce minimum coverage to prevent regressions
      coverage-threshold: 50

  firmware:
    name: ESPHome firmware (synthetic configuration)
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and compile without flashing any device
        run: >-
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace
          --entrypoint python
          ghcr.io/esphome/esphome:2026.9.1@sha256:776a845d508909bf426d2ee7bdd81796361ebe6a7f091807ce1d6d0b48985413
          tests/firmware/check_profile.py --compile
