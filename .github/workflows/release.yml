name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -e ".[dev]"
          pip install --only-binary :all: build==1.2.1 twine==6.0.1

      - name: Verify release tag matches package
        run: |
          python - <<'PYVERSION'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag does not match package version")
          PYVERSION

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-fail-under=50

      - name: Build package
        run: python -m build

      - name: Validate package metadata and checksum assets
        run: |
          twine check --strict dist/*
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
