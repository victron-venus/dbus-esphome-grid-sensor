name: Container contract
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the real runtime image
        run: docker build --tag grid-sensor:test .
      - name: Verify installed module and native imports without network access
        run: >-
          docker run --rm --network none --entrypoint python grid-sensor:test
          -c 'import dbus_grid_service, dbus, gi; from vedbus import VeDbusService;
          assert "/opt/venv/" in dbus_grid_service.__file__;
          assert callable(VeDbusService)'
